<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket & Tennis Analysis Hub</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 500px;
            width: 90%;
            background: #161b26;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid #242b3d;
        }
        .logo-area {
            font-size: 50px;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #00ff88;
        }
        p {
            font-size: 15px;
            color: #a0aec0;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .timer-box {
            background: linear-gradient(90deg, #ff007f, #7f00ff);
            padding: 12px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }
        .btn {
            display: inline-block;
            width: 100%;
            background-color: #00ff88;
            color: #0b0f19;
            text-decoration: none;
            padding: 15px 0;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.4);
            transition: 0.3s;
        }
        .btn:hover {
            transform: scale(1.02);
            background-color: #00e676;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-area">🏏🎾</div>
    <h1>Cricket & Tennis Analysis Hub</h1>
    <p>Get Daily Free Match Previews, Pitch Reports, Weather Updates, and Expert Analytics. Join India's Fastest Growing Sports Family!</p>
    
    <div class="timer-box">
        Redirecting to Telegram in <span id="countdown">15</span> seconds...
    </div>

    <a href="https://t.me" id="tg-btn" class="btn">👉 CLICK HERE TO JOIN FREE TELEGRAM</a>
</div>

<script>
    const telegramLink = "https://t.me"; 
    
    let timeleft = 15;
    const downloadTimer = setInterval(function(){
        if(timeleft <= 0){
            clearInterval(downloadTimer);
            window.location.href = telegramLink;
        } else {
            document.getElementById("countdown").innerHTML = timeleft;
        }
        timeleft -= 1;
    }, 1000);

    document.getElementById("tg-btn").addEventListener("click", function(e) {
        e.preventDefault();
        window.location.href = telegramLink;
    });
</script>

</body>
</html>
